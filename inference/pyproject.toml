[project]
name = "prostate-infer"
version = "1.0.0"
description = "Thesis FedAvg ensemble inference for prostate core-biopsy Gleason (ISUP) grading"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4,<3",
    "openslide-python==1.4.6",
    "openslide-bin==4.0.1.2",
    "transformers==5.17.0",
    "huggingface_hub==1.33.0",
    "timm==1.0.30",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pillow==12.3.0",
    "numpy==2.5.2",
    "pandas>=2.2,<4",
    "scikit-learn==1.9.1",
    "opencv-python-headless==5.0.0.93",
    "tifffile>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov", "tifffile", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prostate_infer"]

[tool.pytest.ini_options]
markers = ["slow: needs real PANDA slides and the Phikon weights (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "N806"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
