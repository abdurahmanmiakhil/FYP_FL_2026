# Alerts go to ALERT_WEBHOOK_URL (Slack/Teams/any webhook), injected by the entrypoint at start.
route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 30s
  repeat_interval: 4h
receivers:
  - name: webhook
    webhook_configs:
      - url: ${ALERT_WEBHOOK_URL}
        send_resolved: true
