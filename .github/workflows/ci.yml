# CI: lint, type-check, tests (unit, integration, end-to-end), security scans, image build.
# CD: on main, images are pushed to GHCR and deployed to staging; production needs a manual approval
#     (GitHub environment "production" with required reviewers).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build test image (python 3.12, CPU torch, all deps)
        run: docker build -f docker/worker.Dockerfile --target test -t gleasonai-worker-test .
      - name: ruff + mypy
        run: |
          docker run --rm -v "$PWD:/src" -w /src gleasonai-worker-test sh -c "
            ruff check backend inference --exclude backend/migrations &&
            ruff format --check backend &&
            mypy --config-file backend/pyproject.toml backend &&
            (cd inference && mypy prostate_infer)"
      - name: inference tests (fake bundle; thesis-metric checks run where models/bundle exists)
        run: docker run --rm -v "$PWD:/src" -w /src/inference gleasonai-worker-test python -m pytest -q --cov=prostate_infer --cov-fail-under=80
      - name: backend tests (migrations, auth, permissions, uploads, job flow, audit)
        run: docker run --rm -v "$PWD:/src" -w /src/backend gleasonai-worker-test python -m pytest -q --cov --cov-fail-under=80
      - name: pip-audit
        run: docker run --rm -v "$PWD:/src" -w /src gleasonai-worker-test sh -c "pip install -q pip-audit && pip-audit -r backend/requirements.txt -r /tmp/infer-reqs.txt"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20.20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact --config /repo/.gitleaks.toml

  e2e:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20.20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: model bundle for CI (random heads - the private thesis models never enter CI)
        run: |
          docker build -f docker/worker.Dockerfile --target test -t gleasonai-worker-test .
          docker run --rm -v "$PWD/models:/models" gleasonai-worker-test python -c \
            "from pathlib import Path; from prostate_infer.testing import write_fake_bundle; write_fake_bundle(Path('/models/bundle'))"
      - name: start the stack
        run: |
          ./scripts/make-env.sh
          make fetch
          make up
          until curl -skf https://localhost/api/v1/ready; do sleep 5; done
          make seed-e2e
      - name: playwright
        run: |
          cd frontend && npm ci && npx playwright install --with-deps chromium
          BASE_URL=https://localhost npx playwright test
      - name: trivy image scan
        run: |
          for img in api worker frontend backup; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.66.0 image --quiet \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 gleasonai/$img:latest
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-report, path: frontend/playwright-report}
      - if: always()
        run: docker compose -f docker-compose.yml logs --tail 200

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [e2e, secrets]
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/gleasonai
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: build and push images
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml build api worker frontend backup
          for s in api worker frontend backup; do docker push "$REGISTRY/$s:$TAG"; done

  deploy-staging:
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/gleasonai && git fetch --quiet && git checkout --quiet ${{ github.sha }}
            REGISTRY=ghcr.io/${{ github.repository_owner }}/gleasonai TAG=${{ github.sha }} docker compose -f docker-compose.yml pull
            REGISTRY=ghcr.io/${{ github.repository_owner }}/gleasonai TAG=${{ github.sha }} docker compose -f docker-compose.yml up -d
            until curl -skf https://localhost/api/v1/ready; do sleep 5; done

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # required reviewers = manual approval
    steps:
      - name: deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/gleasonai && docker compose -f docker-compose.yml run --rm backup backup
            git fetch --quiet && git checkout --quiet ${{ github.sha }}
            REGISTRY=ghcr.io/${{ github.repository_owner }}/gleasonai TAG=${{ github.sha }} docker compose -f docker-compose.yml pull
            REGISTRY=ghcr.io/${{ github.repository_owner }}/gleasonai TAG=${{ github.sha }} docker compose -f docker-compose.yml up -d
            until curl -skf https://localhost/api/v1/ready; do sleep 5; done
